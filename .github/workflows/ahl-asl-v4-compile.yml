name: AHL ASL Companion v4 full ESP32-S3 firmware
on:
  push:
    branches: [ahl/asl-v4-assets-ai-integration-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout protected AHL integration branch
        uses: actions/checkout@v4
      - name: Checkout exact official StackChan 1.6.2
        uses: actions/checkout@v4
        with:
          repository: m5stack/StackChan
          ref: 28b9f0c8bd6acd81cb3c70f1a93c3e373b39d400
          path: upstream
      - name: Build existing brain plus approved ASL graphics and greeting
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: upstream/firmware
          command: |
            python3 "$GITHUB_WORKSPACE/scripts/apply_companion.py"
            python3 "$GITHUB_WORKSPACE/scripts/integrate_asl_v4.py"
            python3 fetch_repos.py
            idf.py build
      - name: Verify flash image and fit in existing OTA app partition
        shell: bash
        run: |
          test -s upstream/firmware/build/stack-chan.bin
          test -s upstream/firmware/build/flasher_args.json
          test -s upstream/firmware/build/generated_assets.bin
          python3 - <<'PY'
          import os
          p='upstream/firmware/build/stack-chan.bin'
          size=os.path.getsize(p)
          print('Application bytes:',size,'partition maximum:',0x4f0000)
          if size > 0x4f0000:
              raise SystemExit('Application exceeds original OTA app partition')
          b=open(p,'rb').read()
          assert b'ASL Companion' in b, 'ASL menu text absent from firmware'
          print('ASL Companion app marker confirmed')
          PY
          sha256sum upstream/firmware/build/stack-chan.bin
      - name: Upload full non-flashed firmware files
        uses: actions/upload-artifact@v4
        with:
          name: AHL-StackChan-ASL-v4-with-existing-brain
          path: |
            upstream/firmware/build/*.bin
            upstream/firmware/build/flash_args
            upstream/firmware/build/flasher_args.json
            upstream/firmware/build/bootloader/*.bin
            upstream/firmware/build/partition_table/*.bin
          if-no-files-found: error
