name: ARLO Slim v1 hands-free listening and on-device name
on:
  push:
    branches: [ahl/arlo-slim-v1-handsfree-name-20261115]
    paths:
      - .github/workflows/arlo-slim-v1-handsfree-name.yml
      - scripts/make_stackchan_slim_v1.py
      - scripts/arlo_slim_v1_handsfree_name.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout isolated two-change ARLO branch
        uses: actions/checkout@v4
      - name: Checkout EXACT manufacturer 1.6.2 behind working Slim v1
        uses: actions/checkout@v4
        with:
          repository: m5stack/StackChan
          ref: 28b9f0c8bd6acd81cb3c70f1a93c3e373b39d400
          path: upstream
      - name: Check Python patch and exact working master identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/arlo_slim_v1_handsfree_name.py
          test -s ARLO_SLIM_V1_HANDSFREE_NAME_RELEASE_NOTES.md
          test -s scripts/make_stackchan_slim_v1.py
          test -s upstream/firmware/main/hal/hal.h
          grep -Fq '_label_logo->setText("STACKCHAN");' upstream/firmware/main/hal/hal.h
          echo "ARLO v1 base is pinned manufacturer StackChan 1.6.2 with AHL Slim v1 script."
      - name: Compile original working AI with ONLY the two ARLO changes
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: upstream/firmware
          command: |
            set -euo pipefail
            test -f main/apps/app_ai_agent/app_ai_agent.cpp
            test -f main/apps/app_espnow_ctrl/app_espnow_ctrl.cpp
            test -f main/apps/app_setup/app_setup.cpp
            python3 ../../scripts/make_stackchan_slim_v1.py
            test ! -e main/apps/app_asl_companion
            python3 fetch_repos.py
            python3 ../../scripts/arlo_slim_v1_handsfree_name.py
            # Recheck native networking, protocol, conversation and preservation.
            grep -Fq "board.StartNetwork();" xiaozhi-esp32/main/application.cc
            grep -Fq "CheckNewVersion();" xiaozhi-esp32/main/application.cc
            grep -Fq "InitializeProtocol();" xiaozhi-esp32/main/application.cc
            grep -Fq "audio_service_.EnableVoiceProcessing(true);" xiaozhi-esp32/main/application.cc
            grep -Fq "ARLO_HANDSFREE" xiaozhi-esp32/main/application.cc
            grep -Fq ARLO main/hal/hal.h
            grep -Fq ARLO main/apps/app_ai_agent/app_ai_agent.cpp
            grep -Fq ARLO main/apps/app_setup/app_setup.cpp
            test ! -f main/hal/arlo_head_control.cc
            test ! -f main/hal/arlo_head_ble_control.cc
            idf.py build
      - name: Verify original firmware supporting images BYTE IDENTICAL to installed Slim v1
        shell: bash
        run: |
          set -euo pipefail
          test -s upstream/firmware/build/stack-chan.bin
          test -s upstream/firmware/build/bootloader/bootloader.bin
          test -s upstream/firmware/build/partition_table/partition-table.bin
          test -s upstream/firmware/build/ota_data_initial.bin
          test -s upstream/firmware/build/generated_assets.bin
          test -s upstream/firmware/build/flasher_args.json
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          build=Path("upstream/firmware/build")
          # Hashes read from the exact user-installed uploaded Slim v1 ZIP.
          expected={
              "bootloader/bootloader.bin":"68194a7d513bcc959f09bceb813f273c8e9be6b42a67ebebf496247a6dd4b9ef",
              "partition_table/partition-table.bin":"48da0866f56d9d8eb1fe786412984d8f1a4a01b3f13f965621fcb916761e1a4b",
              "ota_data_initial.bin":"7d2c7ac4888bfd75cd5f56e8d61f69595121183afc81556c876732fd3782c62f",
              "generated_assets.bin":"9965009834abdfde71d01ffa64f909ae4ac456aecaa956f33730630210e3a65e"
          }
          for name, wanted in expected.items():
              got=sha256((build/name).read_bytes()).hexdigest()
              print("Preserved image:",name,"sha256:",got)
              if got != wanted:
                  raise SystemExit("STOP: original Slim v1 image changed: "+name)
          raw=(build/"stack-chan.bin").read_bytes()
          if not (0 < len(raw) < 0x4f0000):
              raise SystemExit("STOP: application exceeds original OTA partition")
          for marker in (b"ARLO",b"ARLO_HANDSFREE",b"ESPNOW.REMOTE",b"api.tenclass.net",
                         b"robot.get_head_angles",b"robot.set_head_angles"):
              if marker not in raw:
                  raise SystemExit("STOP: protected runtime marker missing: "+str(marker))
          if b"ASL Companion" in raw or b"ARLO_BLE" in raw:
              raise SystemExit("STOP: unrelated AI/Bluetooth features unexpectedly introduced")
          print("PASS: original bootloader, partitions, OTA, artwork assets preserved byte-for-byte.")
          print("PASS: local ARLO naming, original AI, camera tools, OTA server and native hands-free marker.")
          print("Application bytes:",len(raw))
          print("Application sha256:",sha256(raw).hexdigest())
          PY
      - name: Upload verified firmware images and release notes WITHOUT flashing hardware
        uses: actions/upload-artifact@v4
        with:
          name: ARLO-SlimV1-Handsfree-and-Name-Firmware
          path: |
            upstream/firmware/build/*.bin
            upstream/firmware/build/flash_args
            upstream/firmware/build/flasher_args.json
            upstream/firmware/build/bootloader/*.bin
            upstream/firmware/build/partition_table/*.bin
            ARLO_SLIM_V1_HANDSFREE_NAME_RELEASE_NOTES.md
          if-no-files-found: error
